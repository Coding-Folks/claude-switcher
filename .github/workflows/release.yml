name: Release

# Push a tag like v0.2.0 to build the installer and draft a GitHub release with it.
#
# Signing (docs/CODE-SIGNING.md) switches on when the repository variable SIGNPATH_ORGANIZATION_ID and
# the secret SIGNPATH_API_TOKEN exist. Then the app exe is signed first (it is also the admin helper
# behind the UAC prompt), the installer is built around the signed exe, and the installer is signed
# too. Without them the release is unsigned. Either way every asset gets a build provenance
# attestation and a SHA256SUMS entry.
#
# Updates (docs/CODE-SIGNING.md#updates) switch on when the secret TAURI_SIGNING_PRIVATE_KEY exists
# and src-tauri/updater.pub holds its public key: the final installer is signed for the updater and
# latest.json is attached, which installed copies read once the release is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # draft the release
  id-token: write      # build provenance attestation
  attestations: write
  actions: read        # SignPath downloads the uploaded artifacts

env:
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
  UPDATES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
  SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG || 'claude-switcher' }}
  SIGNPATH_POLICY: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag is the app version
        shell: pwsh
        run: ./.github/scripts/check-version.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Check the update key setup
        shell: pwsh
        run: |
          $pub = (Get-Content src-tauri/updater.pub -Raw).Trim()
          if ($env:UPDATES -eq 'true' -and -not $pub) { throw "TAURI_SIGNING_PRIVATE_KEY is set but src-tauri/updater.pub is empty: commit the public key first (docs/CODE-SIGNING.md#updates)." }
          if ($env:UPDATES -ne 'true' -and $pub) { throw "src-tauri/updater.pub has a key but the TAURI_SIGNING_PRIVATE_KEY secret is missing: installed copies would look for updates that never come." }
          "updates: $env:UPDATES"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build app
        working-directory: src-tauri
        run: cargo tauri build --no-bundle

      # ---- sign the app exe ----
      - name: Upload app for signing
        if: env.SIGN == 'true'
        id: app-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: app-unsigned
          path: src-tauri/target/release/claude-switcher.exe
          if-no-files-found: error
      - name: Sign app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600   # an approver confirms each request by hand
          output-artifact-directory: signed-app
      - name: Use the signed app
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-app/claude-switcher.exe src-tauri/target/release/claude-switcher.exe -Force

      # ---- installer ----
      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri bundle --bundles nsis
      - name: Collect installer (no spaces in the name)
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force dist
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" |
            ForEach-Object { Copy-Item $_ (Join-Path $out ($_.Name -replace ' ', '-')) }

      - name: Upload installer for signing
        if: env.SIGN == 'true'
        id: installer-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/*-setup.exe
          if-no-files-found: error
      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
      - name: Use the signed installer and check both signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-installer/*-setup.exe dist/ -Force
          foreach ($f in @("src-tauri/target/release/claude-switcher.exe") + (Get-ChildItem dist/*-setup.exe).FullName) {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed: $($s.Status) $($s.StatusMessage)" }
            "$f signed by $($s.SignerCertificate.Subject)"
          }

      # ---- update signature and latest.json (on the final, Authenticode-signed installer) ----
      - name: Sign the update and write latest.json
        if: env.UPDATES == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          cargo tauri signer sign $setup.FullName
          if ($LASTEXITCODE) { throw "signing the update failed" }
          ./.github/scripts/latest-json.ps1 -Setup $setup.FullName -Tag $env:GITHUB_REF_NAME -Repo $env:GITHUB_REPOSITORY -Out dist/latest.json
          Get-Content dist/latest.json

      # ---- checksums, provenance, release ----
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*-setup.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*-setup.exe
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/latest.json
