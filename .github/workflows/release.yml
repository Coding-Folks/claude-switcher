name: Release

# Push a tag like v0.2.0 to build the installer and draft a GitHub release with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri build
      - name: Rename (no spaces) and checksum
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $out = New-Item -ItemType Directory -Force dist
          Get-ChildItem "$dir/*-setup.exe" | ForEach-Object { Copy-Item $_ (Join-Path $out ($_.Name -replace ' ', '-')) }
          Get-ChildItem "$out/*-setup.exe" | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii "$out/SHA256SUMS.txt"
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
