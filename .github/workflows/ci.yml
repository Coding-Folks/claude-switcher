name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --lib --tests -- -D warnings
      # live_ tests need Claude Desktop installed and running, which CI does not have.
      - run: cargo test --lib -- --skip live_

  ui:
    name: UI and accessibility
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tests-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests-ui/package-lock.json
      - run: npm ci
      # Tests run in the Edge that ships with Windows (playwright channel "msedge").
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests-ui/test-results
