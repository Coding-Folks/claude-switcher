[package]
name = "claude-switcher"
version = "0.1.0"
edition = "2021"
description = "Unofficial Windows tray app that runs several Claude Desktop accounts side by side"
authors = ["Coding Folks <https://codingfolks.dev>"]
license = "MIT"
repository = "https://github.com/Coding-Folks/claude-switcher"
homepage = "https://github.com/Coding-Folks/claude-switcher"
readme = "../README.md"
keywords = ["claude", "tray", "windows", "multi-account", "tauri"]
categories = ["gui"]
rust-version = "1.80"

[lib]
name = "claude_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
rand = "0.8"
zeroize = "1"
winreg = "0.55"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Authorization",
  "Win32_NetworkManagement_NetManagement",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Wdk_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
]
