<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Switcher</title>
  <link rel="stylesheet" href="styles.css">
  <script src="strings.js"></script>
  <script src="mock-invoke.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <header class="head">
      <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false">
        <rect x="316" y="104" width="604" height="604" rx="156" class="mark-back"/>
        <rect x="104" y="316" width="604" height="604" rx="156" class="mark-front"/>
        <circle cx="708" cy="316" r="124" class="mark-dot"/>
      </svg>
      <h1 id="title" data-s="title"></h1>
      <p class="count num" id="count"></p>
    </header>

    <section class="ram" aria-labelledby="ram-finding">
      <p class="finding" id="ram-finding"></p>
      <div class="strip" id="ram-strip" role="img"></div>
      <ul class="legend" id="ram-legend"></ul>
    </section>

    <ul class="accounts" id="accounts" aria-labelledby="title"></ul>

    <div class="add">
      <button type="button" class="primary" id="add-open" data-s="add_account" aria-expanded="false" aria-controls="add-form"></button>
      <form id="add-form" class="add-form" hidden novalidate>
        <label for="add-label" data-s="add_label"></label>
        <input id="add-label" name="label" type="text" maxlength="40" autocomplete="off" aria-describedby="add-hint add-error">
        <p class="hint" id="add-hint" data-s="add_hint"></p>
        <fieldset class="modes">
          <legend data-s="mode_legend"></legend>
          <label class="mode">
            <input type="radio" name="mode" value="same_user" checked aria-describedby="mode-same-hint">
            <span data-s="mode_same"></span>
          </label>
          <p class="hint mode-hint" id="mode-same-hint" data-s="mode_same_hint"></p>
          <label class="mode">
            <input type="radio" name="mode" value="windows_user" aria-describedby="mode-windows-hint">
            <span data-s="mode_windows"></span>
          </label>
          <p class="hint mode-hint" id="mode-windows-hint" data-s="mode_windows_hint"></p>
        </fieldset>
        <p class="field-error" id="add-error" role="alert"></p>
        <div class="row-actions">
          <button type="button" class="secondary" id="add-cancel" data-s="cancel"></button>
          <button type="submit" class="primary" id="add-submit" data-s="add_submit"></button>
        </div>
      </form>
    </div>

    <footer class="foot">
      <label class="switch">
        <input type="checkbox" id="autostart" role="switch">
        <span data-s="autostart"></span>
      </label>
      <p class="hint" data-s="shortcut_hint"></p>
    </footer>

    <div class="live visually-hidden" id="live" aria-live="polite"></div>
    <p class="alert" id="alert" role="alert"></p>
  </main>

  <div class="menu" id="menu" role="menu" hidden></div>

  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="field" id="confirm-field" hidden>
        <label for="confirm-input" data-s="rename_label"></label>
        <input id="confirm-input" type="text" maxlength="40" autocomplete="off">
      </div>
      <div class="row-actions">
        <button value="cancel" class="secondary" id="confirm-cancel" data-s="cancel"></button>
        <button value="ok" class="primary" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
