<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Switcher</title>
  <link rel="stylesheet" href="styles.css">
  <script src="strings.js"></script>
  <script src="mock-invoke.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <header class="head">
      <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false">
        <rect x="316" y="104" width="604" height="604" rx="181" class="mark-back"/>
        <rect x="104" y="316" width="604" height="604" rx="181" class="mark-front"/>
        <circle cx="708" cy="316" r="124" class="mark-dot"/>
      </svg>
      <h1 id="title" data-s="title"></h1>
      <p class="count num" id="count"></p>
      <button type="button" class="icon-btn" id="settings-open" data-s-aria="settings"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><path d="M6.7 1.5h2.6l.4 1.9 1.4.8 1.8-.6 1.3 2.2-1.4 1.3v1.8l1.4 1.3-1.3 2.2-1.8-.6-1.4.8-.4 1.9H6.7l-.4-1.9-1.4-.8-1.8.6-1.3-2.2 1.4-1.3V7.1L1.8 5.8l1.3-2.2 1.8.6 1.4-.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </header>

    <div class="view" id="view-main">

    <section class="update ask" id="link-ask" aria-labelledby="link-ask-title" hidden>
      <div class="update-text">
        <h2 id="link-ask-title" data-s="link_ask"></h2>
        <p class="hint" data-s="link_ask_hint"></p>
      </div>
      <div class="row-actions">
        <button type="button" class="secondary" id="link-later" data-s="link_later"></button>
        <button type="button" class="primary" id="link-fix" data-s="link_fix"></button>
      </div>
    </section>

    <section class="update ask" id="updates-ask" aria-labelledby="updates-ask-title" hidden>
      <div class="update-text">
        <h2 id="updates-ask-title" data-s="updates_ask"></h2>
        <p class="hint" data-s="updates_ask_hint"></p>
      </div>
      <div class="row-actions">
        <button type="button" class="secondary" id="updates-no" data-s="updates_no"></button>
        <button type="button" class="primary" id="updates-yes" data-s="updates_yes"></button>
      </div>
    </section>

    <div class="update" id="update" hidden>
      <p class="update-text"><span id="update-msg" aria-live="polite"></span>
        <button type="button" class="link" id="update-notes" data-s="update_notes"></button></p>
      <button type="button" class="primary" id="update-go" data-s="update_go"></button>
    </div>

    <section class="ram" aria-labelledby="ram-finding">
      <p class="finding" id="ram-finding"></p>
      <div class="strip" id="ram-strip" role="img"></div>
      <ul class="legend" id="ram-legend"></ul>
    </section>

    <div class="search" id="search-box" hidden>
      <label for="search" class="visually-hidden" data-s="search_label"></label>
      <input id="search" type="search" autocomplete="off" spellcheck="false" maxlength="40" data-ph="search_label">
    </div>
    <ul class="accounts" id="accounts" aria-labelledby="title"></ul>
    <p class="visually-hidden" id="usage-help" data-s="usage_help"></p>
    <p class="hint" id="no-match" role="status" hidden></p>

    <div class="add">
      <button type="button" class="primary md" id="add-open" data-s="add_account" aria-expanded="false" aria-controls="add-form"></button>
      <form id="add-form" class="add-form" hidden novalidate>
        <label for="add-label" data-s="add_label"></label>
        <input id="add-label" name="label" type="text" maxlength="40" autocomplete="off" aria-describedby="add-hint add-error">
        <p class="hint" id="add-hint" data-s="add_hint"></p>
        <fieldset class="modes">
          <legend data-s="mode_legend"></legend>
          <label class="mode">
            <input type="radio" name="mode" value="same_user" checked aria-describedby="mode-same-hint">
            <span data-s="mode_same"></span>
          </label>
          <p class="hint mode-hint" id="mode-same-hint" data-s="mode_same_hint"></p>
          <label class="mode">
            <input type="radio" name="mode" value="windows_user" aria-describedby="mode-windows-hint">
            <span data-s="mode_windows"></span>
          </label>
          <p class="hint mode-hint" id="mode-windows-hint" data-s="mode_windows_hint"></p>
        </fieldset>
        <p class="field-error" id="add-error" role="alert"></p>
        <div class="row-actions">
          <button type="button" class="secondary md" id="add-cancel" data-s="cancel"></button>
          <button type="submit" class="primary md" id="add-submit" data-s="add_submit"></button>
        </div>
      </form>
    </div>


    </div>

    <section class="view settings" id="view-settings" aria-labelledby="settings-title" hidden>
      <div class="settings-head">
        <button type="button" class="icon-btn" id="settings-back" data-s-aria="back"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <h2 id="settings-title" data-s="settings"></h2>
      </div>
      <section class="card" aria-labelledby="s-general">
        <h3 id="s-general" data-s="settings_general"></h3>
      <label class="switch">
        <input type="checkbox" id="autostart" role="switch">
        <span data-s="autostart"></span>
      </label>
      <div class="lang">
        <span id="lang-label" data-s="language"></span>
        <div class="picker">
          <button type="button" id="lang" class="picker-btn" role="combobox" aria-labelledby="lang-label" aria-haspopup="listbox"
                  aria-expanded="false" aria-controls="lang-list"><span id="lang-value"></span><svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <ul id="lang-list" class="picker-list" role="listbox" aria-labelledby="lang-label" hidden></ul>
        </div>
      </div>
        <p class="hint" data-s="shortcut_hint"></p>
      </section>
      <section class="card" aria-labelledby="s-updates">
        <h3 id="s-updates" data-s="settings_updates"></h3>
      <label class="switch" id="updates-switch" hidden>
        <input type="checkbox" id="updates" role="switch">
        <span data-s="updates_toggle"></span>
      </label>
        <p class="hint" id="app-version"></p>
        <div class="row-actions start">
          <button type="button" class="secondary" id="update-check" data-s="update_check"></button>
          <button type="button" class="primary" id="update-now" data-s="update_now" hidden></button>
        </div>
        <p class="hint" id="update-status" aria-live="polite"></p>
      </section>
      <section class="card" id="settings-link" aria-labelledby="s-link">
        <h3 id="s-link" data-s="settings_link"></h3>
        <p class="hint" id="link-state"></p>
        <div class="row-actions start"><button type="button" class="secondary" id="link-fix-2" data-s="link_fix_short"></button></div>
      </section>
      <section class="card" aria-labelledby="s-about">
        <h3 id="s-about" data-s="settings_about"></h3>
        <p class="hint" id="about-text"></p>
        <div class="links">
          <button type="button" class="link" data-url="repo">GitHub</button>
          <button type="button" class="link" data-url="bug" data-s="link_bug"></button>
          <button type="button" class="link" data-url="contribute" data-s="link_contribute"></button>
          <button type="button" class="link" data-url="license" data-s="link_license"></button>
        </div>
        <p class="byline"><span data-s="byline_by"></span> <b lang="en">Coding Folks</b></p>
      </section>
    </section>

    <div class="live visually-hidden" id="live" aria-live="polite"></div>
    <p class="alert" id="alert" role="alert"></p>
  </main>

  <div class="menu" id="menu" role="menu" hidden></div>

  <dialog id="continue" aria-labelledby="continue-title">
    <form method="dialog">
      <h2 id="continue-title" data-s="continue_title"></h2>
      <fieldset class="sessions">
        <legend id="continue-from"></legend>
        <div class="session-list" id="continue-list"></div>
      </fieldset>
      <div class="lang">
        <span id="continue-to-label" data-s="continue_to"></span>
        <div class="picker">
          <button type="button" id="continue-to" class="picker-btn" role="combobox" aria-labelledby="continue-to-label" aria-haspopup="listbox"
                  aria-expanded="false" aria-controls="continue-to-list"><span id="continue-to-value"></span><svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <ul id="continue-to-list" class="picker-list" role="listbox" aria-labelledby="continue-to-label" hidden></ul>
        </div>
      </div>
      <p class="hint" id="continue-note"></p>
      <div class="row-actions">
        <button value="cancel" class="secondary" data-s="cancel"></button>
        <button value="ok" class="primary" id="continue-ok" data-s="continue_ok" aria-describedby="continue-note"></button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="field" id="confirm-field" hidden>
        <label for="confirm-input" data-s="rename_label"></label>
        <input id="confirm-input" type="text" maxlength="40" autocomplete="off">
      </div>
      <div class="row-actions">
        <button value="cancel" class="secondary" id="confirm-cancel" data-s="cancel"></button>
        <button value="ok" class="primary" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
